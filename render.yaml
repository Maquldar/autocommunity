# Render Blueprint: one-click demo deployment (web + API in one free web service, Postgres, Key Value).
# Deploy: https://render.com/deploy?repo=https://github.com/Maquldar/autocommunity — see DEPLOY.md.
services:
  - type: web
    name: autocommunity
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: ./infra/render/build.sh
    startCommand: ./infra/render/start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public portfolio demo: login codes are shown on screen (no SMS provider). Never for real users.
      - key: DEMO_MODE
        value: "true"
      # The free plan has no persistent disk, so uploads live in Postgres.
      - key: STORAGE_DRIVER
        value: postgres
      # Hops in front of the API: client → Render's proxy → Next (rewrite, loopback) → API. Trust exactly
      # those two, so req.ip is the address Render's proxy saw. "true" would trust any X-Forwarded-For a
      # client sends (spoofable rate limits). Verify after deploying: see DEPLOY.md "Client IP".
      - key: TRUST_PROXY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: autocommunity-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autocommunity-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true

  - type: keyvalue
    name: autocommunity-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: autocommunity-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
